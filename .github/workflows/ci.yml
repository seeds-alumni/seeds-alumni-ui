name: CI
# 公開するサイト（Storybook・デモ・CDN）のビルドとデプロイは Cloudflare Pages が行う（docs/deploy.md）。PR ごとのプレビューも Pages が作る
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: デザインのルール
        run: npm run check
      - name: 型チェック
        run: npm run typecheck
      - name: dist/ がビルドし直したものと同じか
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::dist/ が古いままです。npm run build してコミットしてください" && exit 1)
